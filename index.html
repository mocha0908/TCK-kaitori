        .map((item) => {
          const candidate = item.search.nameCompact;
          const distance = boundedLevenshtein(query, candidate, 6);
          const dice = diceCoefficient(query, candidate);
          const prefixBonus =
            candidate.startsWith(query.slice(0, Math.min(2, query.length))) ? 0.18 : 0;
          const score = dice + prefixBonus - Math.min(distance, 6) * 0.025;
          return { item, score, distance };
        })
        .filter((entry) => {
          const threshold = query.length <= 4 ? 0.28 : 0.34;
          const allowedDistance = Math.max(1, Math.ceil(query.length * 0.32));
          return entry.score >= threshold || entry.distance <= allowedDistance;
        })
        .sort((left, right) =>
          right.score - left.score ||
          left.distance - right.distance ||
          left.item.name.localeCompare(right.item.name, "ja")
        )
        .slice(0, limit)
        .map((entry) => ({ name: entry.item.name, type: entry.item.type }));
    }

    function boundedLevenshtein(left, right, maxDistance) {
      if (left === right) return 0;
      if (!left) return Math.min(right.length, maxDistance + 1);
      if (!right) return Math.min(left.length, maxDistance + 1);
      if (Math.abs(left.length - right.length) > maxDistance) return maxDistance + 1;

      let previous = Array.from({ length: right.length + 1 }, (_, index) => index);

      for (let i = 1; i <= left.length; i += 1) {
        const current = [i];
        let rowMinimum = current[0];

        for (let j = 1; j <= right.length; j += 1) {
          const insertion = current[j - 1] + 1;
          const deletion = previous[j] + 1;
          const substitution = previous[j - 1] + (left[i - 1] === right[j - 1] ? 0 : 1);
          const value = Math.min(insertion, deletion, substitution);
          current.push(value);
          rowMinimum = Math.min(rowMinimum, value);
        }

        if (rowMinimum > maxDistance) return maxDistance + 1;
        previous = current;
      }

      return previous[right.length];
    }

    function diceCoefficient(left, right) {
      if (left === right) return 1;
      if (left.length < 2 || right.length < 2) return 0;

      const pairs = new Map();
      for (let i = 0; i < left.length - 1; i += 1) {
        const pair = left.slice(i, i + 2);
        pairs.set(pair, (pairs.get(pair) || 0) + 1);
      }

      let overlap = 0;
      for (let i = 0; i < right.length - 1; i += 1) {
        const pair = right.slice(i, i + 2);
        const count = pairs.get(pair) || 0;
        if (count > 0) {
          pairs.set(pair, count - 1);
          overlap += 1;
        }
      }

      return (2 * overlap) / (left.length + right.length - 2);
    }

    async function reportMissingItem() {
      const reportText = [
        "【買取検索・未登録報告】",
        "検索語：" + state.query,
        "確認カテゴリ：" + TYPE_META[state.currentTab].label,
        "確認日時：" + formatDateTime(new Date())
      ].join("\n");

      await copyValue(reportText, "未登録報告文");
      if (CONFIG.reportUrl) {
        window.open(CONFIG.reportUrl, "_blank", "noopener,noreferrer");
      } else {
        showToast("報告文をコピーしました。社内チャットに貼り付けてください");
      }
    }

    function renderFreshness() {
      elements.freshnessCard.classList.remove("warning", "danger");

      if (!state.dataUpdatedAt) {
        elements.dataUpdatedAt.textContent = state.hasConnectionError
          ? "取得できません"
          : "更新時刻が未設定";
        elements.freshnessNote.textContent = state.hasConnectionError
          ? "通信状況を確認してください"
          : "data.jsonのupdatedAtを確認してください";
        elements.freshnessCard.classList.add("danger");
        return;
      }

      const crossedDate = !isSameLocalDate(state.dataUpdatedAt, new Date());
      elements.dataUpdatedAt.textContent = formatDateTime(state.dataUpdatedAt);

      if (state.hasConnectionError) {
        elements.freshnessNote.textContent = "通信失敗・直前の表示を保持中";
        elements.freshnessCard.classList.add("danger");
      } else if (crossedDate) {
        elements.freshnessNote.textContent = "前日以前の価格データです。必ず確認してください";
        elements.freshnessCard.classList.add("danger");
      } else if (state.updateSource !== "json") {
        elements.freshnessNote.textContent = "配信元の更新情報から取得";
        elements.freshnessCard.classList.add("warning");
      } else {
        elements.freshnessNote.textContent = "本日の価格データ";
      }
    }

    function isSameLocalDate(left, right) {
      return (
        left.getFullYear() === right.getFullYear() &&
        left.getMonth() === right.getMonth() &&
        left.getDate() === right.getDate()
      );
    }

    function formatDateTime(date) {
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(date);
    }

    function formatImageUrl(rawUrl) {
      const value = cleanValue(rawUrl);
      if (!value) return FALLBACK_IMAGE;
      if (value.startsWith("data:image/")) return value;

      if (value.includes("drive.google.com")) {
        const match = value.match(/(?:id=|\/d\/)([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(match[1]);
        }
      }

      try {
        const url = new URL(value, window.location.href);
        return ["http:", "https:"].includes(url.protocol) ? url.href : FALLBACK_IMAGE;
      } catch (error) {
        return FALLBACK_IMAGE;
      }
    }

    function openModal(source, name) {
      if (!source || source === FALLBACK_IMAGE || source.startsWith("data:image/svg")) return;
      elements.modalImage.src = source;
      elements.modalImage.alt = name;
      elements.imageModal.classList.add("open");
      document.body.style.overflow = "hidden";
      elements.modalClose.focus();
    }

    function closeModal() {
      elements.imageModal.classList.remove("open");
      elements.modalImage.src = "";
      document.body.style.overflow = "";
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      elements.toast.textContent = message;
      elements.toast.classList.add("show");
      toastTimer = window.setTimeout(() => {
        elements.toast.classList.remove("show");
      }, 2200);
    }

    function hashString(value) {
      let hash = 2166136261;
      for (let index = 0; index < value.length; index += 1) {
        hash ^= value.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(36);
    }
  </script>
